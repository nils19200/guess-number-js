<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el Número - Hot Wheels Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-card" id="game-card">
    <h1>🏎️ Hot Wheels Challenge</h1>
    <p class="subtitle">Adivina el número y gana un carrito Hot Wheels.</p>

    <div class="controls">
      <input type="number" id="inputIntento" min="1" max="100" placeholder="?">
      <button id="btnAdivinar">¡Acelerar!</button>
    </div>

    <p id="mensaje"></p>
    <p id="contador">Intentos: 0</p>
    <p id="historial">Historial: </p>

    <button id="btnReiniciar" style="display: none;">
      🔄 Volver a la pista
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
